[package]
name = "bookworm"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.13.5"
tonic = { version = "0.13.0", features = ["transport"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = { version = "0.1.10", features = ["full"] }
tokio-tungstenite = { version = "0.26.2", features = ["native-tls", "connect"] }
futures-util = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
native-tls = "0.2.14"
reqwest = "0.12.15"

[build-dependencies]
# prost-build = { version = "0.13.5" }
tonic-build = { version = "0.13.0" }

[[bin]]
name = "grpc-server"
path = "src/server.rs"

[[bin]]
name = "grpc-client"
path = "src/client.rs"

[[bin]]
name = "grpc-sserver"
path = "src/sserver.rs"

[[bin]]
name = "grpc-sclient"
path = "src/sclient.rs"

[[bin]]
name = "test_bitstamp"
path = "tests/test_bitstamp.rs"

[[bin]]
name = "test_bitstamp_wss_hb"
path = "tests/test_bitstamp_wss_hb.rs"

[[bin]]
name = "test_bitstamp_rest_ob"
path = "tests/test_bitstamp_rest_ob.rs"

[[bin]]
name = "test_binance"
path = "tests/test_binance.rs"
