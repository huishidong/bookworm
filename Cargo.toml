[package]
name = "bookworm"
version = "0.1.0"
edition = "2024"

[dependencies]
prost = "0.13.5"
tonic = { version = "0.13.0", features = ["transport"] }
tokio = { version = "1.37.0", features = ["full"] }
tokio-stream = { version = "0.1.10", features = ["full"] }
tokio-tungstenite = { version = "0.26.2", features = ["native-tls", "connect"] }
futures-util = "0.3.31"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
native-tls = "0.2.14"
reqwest = "0.12.15"
uuid = { version = "1.16.0", features = ["v4"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
# rand = "0.9.0"
# prometheus = "0.14.0"
# axum = "0.8.3"
# chrono = { version = "0.4.23", features = ["serde"] }

[build-dependencies]
# prost-build = { version = "0.13.5" }
tonic-build = { version = "0.13.0" }

[dev-dependencies]
criterion = "0.5.1"

[[bench]]
name = "benchmarks"
harness = false
